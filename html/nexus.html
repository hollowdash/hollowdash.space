<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/nexus.css">
    <title>NexusChat</title>
</head>
<body>
    <div class="top_rooms_tab">
        <button id="room_one">1</button>
        <button id="room_two">2</button>
        <button id="room_three">3</button>
    </div>
    <div id="messages_container"></div>
    <div id="typing_indicator"></div>
    <div class="bottom_input_container">
        <input id="chatbox_input" placeholder="Enter message...">
        <button id="image_button">+</button>
        <input type="file" id="file-input" accept="image/*" hidden>
        <button id="settings_button">+</button>
    </div>

    <script type="module" src="../javascript/nexus.js"></script>
</body>
</html>
